<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
      <ellipse cx="16" cy="29" rx="10" ry="2.5" fill="#000" opacity="0.35"/>
      <!-- Blue Knight Helmet -->
      <circle cx="16" cy="10" r="6" fill="#718093" stroke="#130f40" stroke-width="1.5"/>
      <rect x="13" y="10" width="6" height="3" fill="#130f40"/>
      <!-- Blue Plume / Feathers -->
      <polygon points="16,4 20,0 14,2" fill="#22a6b3"/>
      <!-- Armor Body -->
      <rect x="12" y="15" width="8" height="8" fill="#22a6b3" stroke="#130f40" stroke-width="1.5"/>
      <rect x="14" y="17" width="4" height="4" fill="#f9ca24"/>
      <!-- Left Shield -->
      <ellipse cx="9" cy="18" rx="4" ry="6" fill="#22a6b3" stroke="#f9ca24" stroke-width="1.5"/>
      <!-- Right Sword Raised -->
      <line x1="21" y1="18" x2="26" y2="6" stroke="#f5f6fa" stroke-width="2"/>
      <line x1="19" y1="16" x2="23" y2="18" stroke="#f9ca24" stroke-width="2"/>
      <!-- Boots -->
      <rect x="12" y="23" width="3" height="5" fill="#2f3640"/>
      <rect x="17" y="23" width="3" height="5" fill="#2f3640"/>
    </svg>