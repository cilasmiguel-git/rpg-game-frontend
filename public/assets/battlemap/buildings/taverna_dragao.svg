<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
      <rect x="4" y="8" width="88" height="84" fill="#000" opacity="0.3"/>
      <!-- Gable Roof -->
      <polygon points="48,4 92,34 4,34" fill="#8B4513" stroke="#3e2723" stroke-width="2"/>
      <polygon points="48,7 87,32 9,32" fill="#a0522d"/>
      <line x1="24" y1="32" x2="48" y2="10" stroke="#5c2b09" stroke-width="2"/>
      <line x1="72" y1="32" x2="48" y2="10" stroke="#5c2b09" stroke-width="2"/>
      <!-- Chimney with smoke -->
      <rect x="74" y="8" width="12" height="18" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1.5"/>
      <circle cx="80" cy="4" r="3" fill="#ecf0f1" opacity="0.6"/>
      <!-- Upper Timber Floor -->
      <rect x="10" y="34" width="76" height="26" fill="#f5cd79" stroke="#3e2723" stroke-width="2"/>
      <line x1="28" y1="34" x2="28" y2="60" stroke="#784212" stroke-width="2"/>
      <line x1="68" y1="34" x2="68" y2="60" stroke="#784212" stroke-width="2"/>
      <line x1="10" y1="34" x2="86" y2="60" stroke="#784212" stroke-width="1.5"/>
      <line x1="86" y1="34" x2="10" y2="60" stroke="#784212" stroke-width="1.5"/>
      <!-- Tavern Signboard (Ale Mug) -->
      <rect x="4" y="42" width="10" height="12" fill="#f39c12" stroke="#000" stroke-width="1"/>
      <rect x="6" y="44" width="6" height="8" fill="#f1c40f"/>
      <!-- Lower Stone Floor -->
      <rect x="8" y="60" width="80" height="32" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
      <rect x="10" y="62" width="76" height="28" fill="#bdc3c7"/>
      <!-- Warm Yellow Windows -->
      <rect x="18" y="66" width="16" height="14" fill="#f1c40f" stroke="#3e2723" stroke-width="1.5"/>
      <line x1="26" y1="66" x2="26" y2="80" stroke="#3e2723" stroke-width="1"/>
      <rect x="62" y="66" width="16" height="14" fill="#f1c40f" stroke="#3e2723" stroke-width="1.5"/>
      <line x1="70" y1="66" x2="70" y2="80" stroke="#3e2723" stroke-width="1"/>
      <!-- Sturdy Tavern Double Door -->
      <rect x="38" y="64" width="20" height="26" fill="#5c2b09" stroke="#3e2723" stroke-width="2"/>
      <circle cx="44" cy="78" r="1.5" fill="#f1c40f"/>
      <circle cx="52" cy="78" r="1.5" fill="#f1c40f"/>
    </svg>