<div class="session-layout">
  <!-- Top Session Bar -->
  <header class="session-topbar">
    <div class="topbar-left">
      <button class="back-btn" (click)="returnToLobby()" title="Voltar ao Lobby">
        ⬅ Lobby
      </button>
      <div class="party-info">
        <h1 class="campaign-title">{{ party()?.title || 'Sessão RPG' }}</h1>
        <span class="session-status-badge">● Em Andamento</span>
      </div>
    </div>

    <!-- Dice Roller Bar -->
    <div class="dice-bar">
      <span class="dice-label">Dados:</span>
      <button class="dice-btn d20" (click)="rollDice(20)" title="Rolar D20">
        <game-icon name="d20" [size]="15"></game-icon> D20
      </button>
      <button class="dice-btn" (click)="rollDice(12)" title="Rolar D12">
        <game-icon name="dice" [size]="14"></game-icon> D12
      </button>
      <button class="dice-btn" (click)="rollDice(8)" title="Rolar D8">
        <game-icon name="dice" [size]="14"></game-icon> D8
      </button>
      <button class="dice-btn" (click)="rollDice(6)" title="Rolar D6">
        <game-icon name="dice" [size]="14"></game-icon> D6
      </button>
      <button class="dice-btn" (click)="rollDice(100)" title="Rolar D100">
        <game-icon name="dice" [size]="14"></game-icon> D100
      </button>

      @if (lastDiceRoll(); as roll) {
        <div class="roll-result-pill" [class.crit]="roll.critical">
          <span class="roll-dice-type">{{ roll.dice }}:</span>
          <strong class="roll-val">{{ roll.value }}</strong>
          <span class="roll-desc">{{ roll.text }}</span>
        </div>
      }
    </div>

    <!-- Topbar Actions -->
    <div class="topbar-actions">
      @if (currentPhase()) {
        <button class="lore-view-btn flex items-center gap-1.5" (click)="isLoreModalOpen.set(true)">
          <game-icon name="scroll" [size]="15"></game-icon> Ver Narração IA
        </button>
      }
      @if (isMaster) {
        <button class="master-phase-btn flex items-center gap-1.5" (click)="openPhaseModal()">
          <game-icon name="sparkles" [size]="15"></game-icon> Nova Fase (IA)
        </button>
      }
    </div>
  </header>

  <!-- Main Playing Area: Battlemap Grid -->
  <div class="session-body">
    <main class="battlemap-area">
      <app-battlemap-grid></app-battlemap-grid>
    </main>
  </div>

  <!-- Modal: Criar Nova Fase com IA (Apenas Mestre) -->
  <app-modal
    [isOpen]="isPhaseModalOpen()"
    title="Criar Nova Fase com Narração e Imagem de IA"
    maxWidth="650px"
    (close)="isPhaseModalOpen.set(false)"
  >
    <form (ngSubmit)="submitNewPhase()" class="phase-form">
      <div class="form-group">
        <label>Título do Capítulo / Encontro:</label>
        <input
          type="text"
          [(ngModel)]="newPhaseForm.title"
          name="phaseTitle"
          placeholder="Ex: A Emboscada na Ponte dos Suspiros"
          required
        />
      </div>

      <div class="form-group">
        <label>Anotações do Mestre (Ideias de enredo, monstros e ambiente):</label>
        <textarea
          [(ngModel)]="newPhaseForm.masterNotes"
          name="masterNotes"
          rows="5"
          placeholder="Descreva o que acontece livremente. A IA formatará isso em uma narração cinematográfica de RPG e criará a ilustração artística do cenário automaticamente..."
          required
        ></textarea>
        <small class="helper-text">
          A IA preservará seus acontecimentos e aplicará o tom do tema escolhido.
        </small>
      </div>

      <div class="checkbox-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [(ngModel)]="newPhaseForm.autoGenerateImage"
            name="autoGenerateImage"
          />
          <span>Gerar ilustração artística da cena automaticamente com IA</span>
        </label>
      </div>

      <div class="form-actions">
        <app-button
          variant="secondary"
          type="button"
          (onClick)="isPhaseModalOpen.set(false)"
        >
          Cancelar
        </app-button>
        <app-button
          variant="primary"
          type="submit"
          [loading]="createPhaseMutation.isPending()"
        >
          <game-icon name="sparkles" [size]="15"></game-icon> Criar e Narrar Fase
        </app-button>
      </div>
    </form>
  </app-modal>

  <!-- Modal: Visualizador Completo de Lore e Imagem da Fase Atual -->
  <app-modal
    [isOpen]="isLoreModalOpen()"
    title="Cena & Narração Atual"
    maxWidth="750px"
    (close)="isLoreModalOpen.set(false)"
  >
    <app-phase-narrative
      [phase]="currentPhase()"
      [isMaster]="isMaster"
      [isGeneratingImage]="generateImageMutation.isPending()"
      (onGenerateImage)="onGenerateImage($event)"
      (onAdvancePhase)="openPhaseModal()"
    ></app-phase-narrative>
  </app-modal>
</div>
