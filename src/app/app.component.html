<div class="app-layout">
  <!-- Master Sidebar (Full Height, spans alongside header and content) -->
  @if (isMaster()) {
    <app-master-sidebar></app-master-sidebar>
  }

  <div class="app-main-wrapper">
    <!-- Top Navigation Header -->
    <header class="app-navbar">
      <div class="navbar-brand">
        <a routerLink="/lobby" class="brand-link">
          <span class="brand-icon">
            <game-icon name="crossed-swords" [size]="22" color="#f1c40f"></game-icon>
          </span>
          <div class="brand-text">
            <span class="brand-title">RPG BATTLEMAP</span>
            <span class="brand-subtitle">Party & Lore AI</span>
          </div>
        </a>
      </div>

      <!-- Right Side: User profile & Logout -->
      <div class="navbar-right">
        @if (currentUser(); as user) {
          <div class="user-pill">
            <span class="role-tag" [class.master]="user.role === 'MASTER'">
              @if (user.role === 'MASTER') {
                <game-icon name="crown" [size]="12" color="#f1c40f"></game-icon> Mestre
              } @else {
                <game-icon name="dice" [size]="12"></game-icon> Jogador
              }
            </span>
            <span class="user-name">{{ user.username || user.playerName || 'Aventureiro' }}</span>
          </div>
          <button class="logout-btn" (click)="logout()" title="Sair da sessão">
            <game-icon name="logout" [size]="14"></game-icon> Sair
          </button>
        } @else {
          <a routerLink="/auth" class="login-link">Entrar</a>
        }
      </div>
    </header>

    <!-- Main View Outlet -->
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Right Game Session Sidebar (Jitsi Meet / Chat / Mesa) - Full height alongside Header & Content -->
  @if (isInGameSession()) {
    <app-party-sidebar></app-party-sidebar>
  }
</div>
