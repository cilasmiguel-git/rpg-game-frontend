      <line x1="86" y1="30" x2="64" y2="58" stroke="#3e2723" stroke-width="2"/>
      <!-- Ornate Stained Glass Windows -->
      <rect x="14" y="66" width="14" height="16" fill="#82ccdd" stroke="#3e2723" stroke-width="1.5"/>
