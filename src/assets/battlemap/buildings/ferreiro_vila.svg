<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" shape-rendering="crispEdges">
      <rect x="4" y="6" width="88" height="54" fill="#000" opacity="0.3"/>
      <!-- Workshop Roof -->
      <polygon points="48,2 92,20 4,20" fill="#4b6584" stroke="#1e272e" stroke-width="2"/>
      <polygon points="48,5 88,18 8,18" fill="#778ca3"/>
      <!-- Forge Chimney with Fire Glow -->
      <rect x="70" y="2" width="16" height="24" fill="#d63031" stroke="#2c3e50" stroke-width="2"/>
      <rect x="74" y="6" width="8" height="10" fill="#fdcb6e"/>
      <!-- Stone Walls -->
      <rect x="8" y="20" width="80" height="40" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
      <!-- Open Forge Shed on Right -->
      <rect x="52" y="24" width="32" height="34" fill="#2d3436"/>
      <!-- Glowing Anvil & Smelter -->
      <polygon points="68,44 76,44 74,52 64,52" fill="#718093" stroke="#000" stroke-width="1.5"/>
      <rect x="66" y="34" width="12" height="6" fill="#e17055"/>
      <!-- Workshop Door -->
      <rect x="18" y="28" width="16" height="32" fill="#5c2b09" stroke="#3e2723" stroke-width="1.5"/>
      <circle cx="28" cy="44" r="1.5" fill="#f1c40f"/>
    </svg>