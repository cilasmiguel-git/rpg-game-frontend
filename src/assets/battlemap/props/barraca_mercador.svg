<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
      <rect x="4" y="6" width="56" height="54" fill="#000" opacity="0.3"/>
      <!-- Striped Canopy Roof -->
      <polygon points="32,4 60,20 4,20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <!-- Canopy stripes -->
      <polygon points="14,10 24,20 4,20" fill="#f1f2f6"/>
      <polygon points="36,6 46,20 28,20" fill="#f1f2f6"/>
      <!-- Wooden Posts -->
      <rect x="8" y="20" width="4" height="38" fill="#5c2b09"/>
      <rect x="52" y="20" width="4" height="38" fill="#5c2b09"/>
      <!-- Counter Table -->
      <rect x="6" y="36" width="52" height="22" fill="#8B4513" stroke="#3e2723" stroke-width="2"/>
      <!-- Goods on Table (Potions & Fruit) -->
      <circle cx="16" cy="32" r="3" fill="#e74c3c" stroke="#000" stroke-width="1"/>
      <circle cx="26" cy="32" r="3" fill="#2ecc71" stroke="#000" stroke-width="1"/>
      <circle cx="36" cy="32" r="3" fill="#3498db" stroke="#000" stroke-width="1"/>
      <rect x="44" y="28" width="10" height="8" fill="#f39c12" stroke="#000" stroke-width="1"/>
    </svg>